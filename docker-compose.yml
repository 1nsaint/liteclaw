# LiteClaw gateway (your fork of OpenClaw for self-hosted/Ollama).
# Build from source, then run. Ollama on LAN (Jetson): explicit IP + port 11434.
services:
  liteclaw:
    build: .
    image: liteclaw:local
    container_name: liteclaw
    restart: unless-stopped
    ports:
      - "18789:18789"   # gateway port (default)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # So the gateway is reachable from host (pair TUI, browser)
      - OPENCLAW_GATEWAY_PORT=18789
      # Ollama on Jetson (LAN); OPENCLAW_OLLAMA_BASE_URL overrides config if missing
      - OPENCLAW_OLLAMA_BASE_URL=http://192.168.0.146:11434
      # Local Ollama has no real API key; any value registers the provider so the agent can run
      - OLLAMA_API_KEY=ollama-local
    # Override default loopback bind so host can connect (seed config allows Control UI)
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured", "--bind", "lan"]
    volumes:
      - liteclaw-data:/home/node/.openclaw
    # Gateway does heavy async init before binding the port; mark healthy only when UI responds
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18789/', r => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      start_period: 45s
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  liteclaw-data: {}
